name: Development Bot Readiness

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

jobs:
  development-smoke:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate development configuration
        env:
          APP_ENV: development
          BOT_TOKEN_DEV: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          STIXMAGIC_API_KEY_DEV: "smoke-test-only-key"
          SESSION_SECRET_DEV: "smoke-test-secret"
          MINIAPP_URL_DEV: "https://example.com/miniapp"
          TELEGRAM_WEBHOOK_SECRET: "smoke-test-secret"
          STIXMAGIC_PUBLIC_BASE_URL: "https://example.com"
        run: |
          python scripts/check_config.py --mode ci
          python scripts/smoke_test.py
