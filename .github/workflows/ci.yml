name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate bot changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall .

      - name: Runtime unit checks (no secrets required)
        run: python -m unittest tests.test_config_runtime

      - name: Runtime architecture smoke
        run: |
          python - <<'PY'
          from src.bot import build_runtime_summary
          from src.animations import describe_animation_stack
          summary = build_runtime_summary()
          stack = describe_animation_stack()
          assert any(item["owner"] == "src/stickers" for item in summary["core"])
          assert any(plugin["slug"] == "truck-club" for plugin in summary["plugins"])
          assert "pipeline.motion_presets" in stack["pipeline_modules"]
          print("Runtime summary and animation stack validated")
          PY
