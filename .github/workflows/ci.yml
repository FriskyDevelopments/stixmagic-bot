name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate bot changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall .

      - name: Smoke test (config + DB)
        env:
          APP_ENV: development
          BOT_TOKEN_DEV: ${{ secrets.BOT_TOKEN_DEV || secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || '000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' }}
          STIXMAGIC_API_KEY_DEV: ${{ secrets.STIXMAGIC_API_KEY_DEV || secrets.STIXMAGIC_API_KEY || 'ci-placeholder-api-key' }}
          SESSION_SECRET_DEV: ${{ secrets.SESSION_SECRET_DEV != '' && secrets.SESSION_SECRET_DEV || secrets.SESSION_SECRET }}
          MINIAPP_URL_DEV: ${{ secrets.MINIAPP_URL_DEV != '' && secrets.MINIAPP_URL_DEV || secrets.MINIAPP_URL }}
        run: |
          python scripts/check_config.py
          python scripts/smoke_test.py
