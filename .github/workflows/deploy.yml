name: Deploy Bot

on:
  push:
    branches:
      - main

# To deploy to a persistent server, configure a self-hosted runner on that
# machine and this workflow will install dependencies and start the bot there.
# When using GitHub-hosted runners the job runs until the runner times out
# (≈ 6 h); for always-on hosting use Replit (see replit.md) or a VPS with a
# systemd service / process manager like supervisor.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate bot configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STIXMAGIC_API_KEY: ${{ secrets.STIXMAGIC_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          python - <<'EOF'
          import os, re, sys
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is not set.", file=sys.stderr)
              sys.exit(1)
          if not re.search(r'\d+:[A-Za-z0-9_-]+', token):
              print("ERROR: TELEGRAM_BOT_TOKEN has an invalid format.", file=sys.stderr)
              sys.exit(1)
          print("Configuration validated successfully.")
          EOF

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STIXMAGIC_API_KEY: ${{ secrets.STIXMAGIC_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MINIAPP_URL: ${{ secrets.MINIAPP_URL }}
        run: |
          python main.py
